name: Headless browser

on:
  push:
    branches: [main, 'codex/headless-browser']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool x11vnc ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          command -v google-chrome
      - name: Unit tests and build
        run: |
          make test test-browser all
      - name: Real headless browser and AirPlay transport
        # The hosted runner's sandbox policy may block unprivileged Chrome
        # namespaces. This explicit exception is only for the local generated
        # fixture, with no HA credentials or private URLs available to this job.
        run: python3 -B scripts/browser-smoke.py --no-browser-sandbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-browser-evidence
          path: artifacts/browser/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-browser-tools
          path: |
            bin/doubletake
            bin/doubletake-ctl
            bin/doubletake-test-receiver
            scripts/doubletake-browser
            deploy/doubletake-browser.service
            docs/headless-browser.md
