name: Home Assistant app
on:
  push:
    branches: [main, 'codex/ha-app']
    paths: ['app/**', '.github/workflows/ha-app.yml']
  pull_request:
    branches: [main]
    paths: ['app/**', '.github/workflows/ha-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - name: Build installable app
        uses: docker/build-push-action@v6
        with:
          context: app
          tags: doubletake-app
          load: true
          cache-from: type=gha,scope=ha-app
          cache-to: type=gha,mode=max,scope=ha-app
      - name: Sandboxed browser preflight
        run: |
          docker run --rm --cap-add SYS_ADMIN --user 1000:1000 --entrypoint /bin/sh doubletake-app -c 'timeout 20 google-chrome --headless --disable-gpu --dump-dom about:blank'
      - name: Private Xvnc startup preflight
        run: |
          docker run --rm -i --network none --user 1000:1000 -v "$PWD/app/tests:/tests:ro" --entrypoint python3 doubletake-app -B - <<'PY'
          import os
          from pathlib import Path
          import select
          import secrets
          import signal
          import socket
          import stat
          import subprocess
          import sys
          import tempfile
          from display import _private_vnc_password
          from rfb_keepalive import connect_keeper
          sys.path.insert(0, "/tests")
          from present_clock import measure

          # Disposable container only: no browser, profile, real credentials, writable mounts,
          # TCP listeners, or external network. Only this synthetic probe prints raw
          # Xvnc startup errors. Xvnc requires an incoming endpoint, so use a private
          # Unix socket with a one-time password confined to this disposable container.
          os.umask(0o077)
          with tempfile.TemporaryDirectory(prefix='xvnc-probe-') as directory:
              runtime = Path(directory)
              password = runtime / 'xvnc.pass'
              rfb = runtime / 'xvnc-rfb'
              private_password = _private_vnc_password(password)
              authority = runtime / 'Xauthority'
              authority.touch(mode=0o600)
              cookie = secrets.token_hex(16)
              def authorize(display):
                  subprocess.run(['xauth', '-f', str(authority), 'source', '-'],
                                 input=f'add {display} MIT-MAGIC-COOKIE-1 {cookie}\n',
                                 text=True, check=True, stdout=subprocess.DEVNULL,
                                 stderr=subprocess.DEVNULL, timeout=5)
              authorize(':0')
              read_fd, write_fd = os.pipe()
              process = subprocess.Popen([
                  'Xvnc', '-displayfd', str(write_fd), '-geometry', '1920x1080',
                  '-depth', '24', '-nolisten', 'tcp', '-auth', str(authority),
                  '-noreset', '-rfbport', '-1',
                  '-rfbunixpath', str(rfb), '-rfbunixmode', '0600',
                  '-SecurityTypes', 'VncAuth', '-PasswordFile', str(password),
                  '-rendernode', '', '-desktop', 'CI display probe'],
                  pass_fds=(write_fd,), stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                  text=True, start_new_session=True)
              os.close(write_fd)
              ready = False
              try:
                  if select.select([read_fd], [], [], 10)[0]:
                      number = os.read(read_fd, 32).strip()
                      ready = number.isdigit() and process.poll() is None
                  if ready:
                      assert stat.S_ISSOCK(rfb.stat().st_mode)
                      assert stat.S_IMODE(rfb.stat().st_mode) == 0o600
                      assert stat.S_IMODE(password.stat().st_mode) == 0o600
                      with socket.socket(socket.AF_UNIX) as connection:
                          connection.settimeout(2)
                          connection.connect(str(rfb))
                          stream = connection.makefile('rb')
                          version = stream.read(12)
                          assert version == b'RFB 003.008\n'
                          connection.sendall(version)
                          assert stream.read(2) == b'\x01\x02', 'VncAuth must be the only security type'
                      os.environ['DISPLAY'] = ':' + number.decode('ascii')
                      os.environ['XAUTHORITY'] = str(authority)
                      authorize(os.environ['DISPLAY'])
                      before = measure(3)
                      assert before['hz'] < 2, before
                      with connect_keeper(rfb, private_password, expected_pid=process.pid):
                          active = measure(30)
                          assert active['hz'] >= 45 and active['max_gap_ms'] < 100, active
                      after = measure(3)
                      assert after['hz'] < 2, after
                      print({'present_clock_without_keeper':before,
                             'present_clock_with_keeper':active,
                             'present_clock_after_disconnect':after})
              finally:
                  os.close(read_fd)
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                  try:
                      _, errors = process.communicate(timeout=3)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      _, errors = process.communicate(timeout=3)
                  print(errors[-16384:])
          print('Disposable authenticated Xvnc display ready:', ready)
          sys.exit(0 if ready else 1)
          PY
      - name: App boundary and lifecycle tests
        run: docker run --rm --user 1000:1000 --entrypoint python3 -v "$PWD/app:/source:ro" doubletake-app -B -m unittest discover -s /source/tests -v
      - name: Prepare integration fixture
        run: |
          go test ./cmd/doubletake-test-receiver ./internal/airplay -run 'TestReceiver|TestVideoStats'
          go build -o bin/doubletake-test-receiver ./cmd/doubletake-test-receiver
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --prefix /tmp/app-playwright playwright@1.58.2
      - name: Multiple-TV controls and responsive layout
        run: node app/tests/multi_tv_ui.cjs artifacts/app/ui
      - name: Native browser, interactive preview and AirPlay transport
        run: python3 -B app/tests/integration.py
      - name: Diagnostic-mode fallback and profile lifecycle
        env:
          DOUBLETAKE_TEST_CONTROL: diagnostic
        run: python3 -B app/tests/integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-assistant-app-evidence
          path: artifacts/app/
