name: Doubletake Browser
version: "0.1.7"
slug: doubletake_browser
description: Interactive browser views with sound sent to one or more Apple TVs
url: https://github.com/jtorrap/doubletake
arch:
  - amd64
startup: application
boot: auto
init: true
host_network: true
video: true
# Chrome's setuid sandbox needs namespace creation under Docker seccomp.
# The controller and browser run as uid 1000; protection remains enabled.
privileged:
  - SYS_ADMIN
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:cast
panel_admin: true
services:
  - mqtt:need
tmpfs: true
timeout: 60
backup: cold
stage: experimental
options:
  quality: 1080p_30
  audio: true
  hardware_decoding: true
  browser_control: native
schema:
  quality: list(1080p_15|1080p_30|720p_30)
  audio: bool
  hardware_decoding: bool
  browser_control: list(native|diagnostic)
